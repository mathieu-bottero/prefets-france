# This is a basic workflow that is manually triggered

name: Schedule workflow

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le déclencheur
        run: |
          echo "Evenement : ${{ github.event_name }}"
          date -u
