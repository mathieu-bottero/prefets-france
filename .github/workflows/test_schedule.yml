name: Test cron GitHub

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: '55 15 * * *'
  
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le déclencheur
        run: |
          echo "Evenement : ${{ github.event_name }}"
          date -u
