<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte des préfets de France</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1600px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

header{
    padding:40px;
    color:white;
    text-align:center;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
}

h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

.subtitle{
    opacity:.9;
}

.content{
    display:grid;
    grid-template-columns:1fr 380px;
}

.map-section{
    padding:20px;
    background:#f8fafc;
}

.sidebar{
    padding:25px;
    border-left:1px solid #e5e7eb;
    overflow-y:auto;
}

#map{
    width:100%;
    height:750px;
    background:white;
    border-radius:14px;
}

.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid #d1d5db;
    font-size:15px;
}

.search-box input:focus{
    outline:none;
    border-color:#667eea;
}

.legend{
    background:#f8fafc;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.legend h3{
    margin-bottom:15px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.legend-color{
    width:35px;
    height:20px;
    border-radius:5px;
    border:1px solid #333;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:#f8fafc;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.stat-number{
    font-size:2rem;
    font-weight:bold;
    color:#667eea;
}

.stat-label{
    font-size:.85rem;
    color:#666;
}

.info-panel{
    background:#f8fafc;
    padding:20px;
    border-radius:12px;
}

.department{
    stroke:white;
    stroke-width:1.2;
    cursor:pointer;
    transition:.2s;
}

.department:hover{
    stroke:#111827;
    stroke-width:2.5;
    filter:brightness(1.05);
}

.region{
    pointer-events:none;
}

.dept-label{
    font-size:10px;
    font-weight:bold;
    fill:#1f2937;
    text-anchor:middle;
    pointer-events:none;
}

.tooltip{
    position:fixed;
    z-index:9999;
    background:rgba(17,24,39,.96);
    color:white;
    padding:16px;
    border-radius:12px;
    max-width:350px;
    pointer-events:none;
    opacity:0;
    transition:.2s;
    line-height:1.5;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.tooltip.visible{
    opacity:1;
}

.tooltip h3{
    margin-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.2);
    padding-bottom:8px;
}

@media(max-width:1100px){

    .content{
        grid-template-columns:1fr;
    }

    .sidebar{
        border-left:none;
        border-top:1px solid #e5e7eb;
    }

}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>🗺️ Carte des préfets de France</h1>
    <div class="subtitle">
        Répartition géographique et ancienneté
    </div>
</header>

<div class="content">

    <div class="map-section">
        <div id="map"></div>
    </div>

    <aside class="sidebar">

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Rechercher un département ou un préfet..."
            >
        </div>

        <div class="legend">
            <h3>Ancienneté en poste</h3>

            <div class="legend-item">
                <div class="legend-color" style="background:#4ade80"></div>
                <div>Moins de 6 mois</div>
            </div>

            <div class="legend-item">
                <div class="legend-color" style="background:#facc15"></div>
                <div>6 mois à 1 an</div>
            </div>

            <div class="legend-item">
                <div class="legend-color" style="background:#fb923c"></div>
                <div>1 an à 2 ans</div>
            </div>

            <div class="legend-item">
                <div class="legend-color" style="background:#ef4444"></div>
                <div>Plus de 2 ans</div>
            </div>
        </div>

        <div class="stats">

            <div class="stat-card">
                <div class="stat-number" id="total-prefets">-</div>
                <div class="stat-label">Préfets</div>
            </div>

            <div class="stat-card">
                <div class="stat-number" id="total-femmes">-</div>
                <div class="stat-label">Femmes</div>
            </div>

            <div class="stat-card">
                <div class="stat-number" id="total-hommes">-</div>
                <div class="stat-label">Hommes</div>
            </div>

            <div class="stat-card">
                <div class="stat-number" id="anciennete-moyenne">-</div>
                <div class="stat-label">Ancienneté moyenne</div>
            </div>

        </div>

        <div class="info-panel" id="info-panel">
            <h3>Information</h3>

            <p>
                Survolez ou cliquez sur un département
                pour afficher les informations détaillées.
            </p>
        </div>

    </aside>

</div>

</div>

<div id="tooltip" class="tooltip"></div>

<script>

const colors = {
    green:"#4ade80",
    yellow:"#facc15",
    orange:"#fb923c",
    red:"#ef4444"
};

Promise.all([
    d3.json("data/departements.geojson"),
    d3.json("data/regions.geojson"),
    d3.dsv(";", "data/prefets_departements.csv")
])

.then(([geoData, regionsData, prefetsData]) => {

    const prefetsMap = {};

    prefetsData.forEach(p => {
        prefetsMap[p.departement] = p;
    });

    const container = document.getElementById("map");

    const width = container.clientWidth;
    const height = container.clientHeight;

    const svg = d3.select("#map")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", `0 0 ${width} ${height}`);

    const projection = d3.geoMercator()
        .fitSize([width, height], geoData);

    const path = d3.geoPath().projection(projection);

    // =========================
    // Départements
    // =========================

    const departments = svg.append("g")
        .selectAll("path")
        .data(geoData.features)
        .enter()
        .append("path")
        .attr("class", "department")
        .attr("d", path)

        .attr("fill", d => {

            const code = d.properties.code;
            const prefet = prefetsMap[code];

            if(!prefet){
                return "#f3f4f6";
            }

            return colors[prefet.couleur_carte];
        })

        .on("mousemove", (event, d) => {

            const code = d.properties.code;
            const prefet = prefetsMap[code];

            if(!prefet){
                return;
            }

            const titres = prefet.titre_global
                .split("|")
                .map(t => `• ${t.trim()}`)
                .join("<br>");

            d3.select("#tooltip")
                .classed("visible", true)
                .html(`
                    <h3>${prefet.nom_prefet}</h3>

                    <div>
                        <strong>${prefet.territoire}</strong>
                    </div>

                    <br>

                    <div>${titres}</div>

                    <br>

                    <div>
                        En poste depuis :
                        ${prefet.date_prise_fonction}
                    </div>

                    <div>
                        Ancienneté :
                        ${prefet.anciennete_jours} jours
                    </div>
                `)

                .style("left", (event.pageX + 20) + "px")
                .style("top", (event.pageY + 20) + "px");
        })

        .on("mouseleave", () => {

            d3.select("#tooltip")
                .classed("visible", false);
        })

        .on("click", (event, d) => {

            const code = d.properties.code;
            const prefet = prefetsMap[code];

            if(!prefet){
                return;
            }

            document.getElementById("info-panel").innerHTML = `
                <h3>${prefet.nom_prefet}</h3>

                <p>
                    <strong>${prefet.territoire}</strong>
                </p>

                <br>

                <p>
                    ${prefet.titre_global}
                </p>

                <br>

                <p>
                    En poste depuis :
                    ${prefet.date_prise_fonction}
                </p>

                <p>
                    Ancienneté :
                    ${prefet.anciennete_jours} jours
                </p>
            `;
        });

    // =========================
    // Régions
    // =========================

    svg.append("g")
        .selectAll("path")
        .data(regionsData.features)
        .enter()
        .append("path")
        .attr("class", "region")
        .attr("d", path)

        .attr("fill", "none")

        .attr("stroke", d => {

            if(d.properties.nom === "Centre-Val de Loire"){
                return "#2563eb";
            }

            return "#374151";
        })

        .attr("stroke-width", d => {

            if(d.properties.nom === "Centre-Val de Loire"){
                return 4;
            }

            return 1.2;
        })

        .attr("opacity", d => {

            if(d.properties.nom === "Centre-Val de Loire"){
                return 1;
            }

            return 0.3;
        });

    // =========================
    // Labels départements
    // =========================

    svg.append("g")
        .selectAll("text")
        .data(geoData.features)
        .enter()
        .append("text")
        .attr("class", "dept-label")

        .attr("transform", d => {

            const centroid = path.centroid(d);

            return `translate(${centroid[0]}, ${centroid[1]})`;
        })

        .text(d => d.properties.code);

    // =========================
    // Recherche
    // =========================

    document.getElementById("search")
        .addEventListener("input", e => {

            const search = e.target.value.toLowerCase();

            departments.style("opacity", d => {

                if(!search){
                    return 1;
                }

                const code = d.properties.code;
                const prefet = prefetsMap[code];

                if(!prefet){
                    return 0.2;
                }

                const match =
                    prefet.nom_prefet.toLowerCase().includes(search)
                    ||
                    prefet.territoire.toLowerCase().includes(search)
                    ||
                    prefet.departement.includes(search);

                return match ? 1 : 0.15;
            });

        });

    // =========================
    // Stats
    // =========================

    document.getElementById("total-prefets")
        .textContent = prefetsData.length;

    document.getElementById("total-femmes")
        .textContent = prefetsData.filter(p => p.sexe === "F").length;

    document.getElementById("total-hommes")
        .textContent = prefetsData.filter(p => p.sexe === "M").length;

    const moyenne = Math.round(
        prefetsData.reduce((sum, p) => {
            return sum + parseInt(p.anciennete_jours);
        }, 0) / prefetsData.length
    );

    document.getElementById("anciennete-moyenne")
        .textContent = moyenne;

})

.catch(error => {

    console.error(error);

    document.getElementById("map").innerHTML = `
        <div style="padding:40px;color:red">
            Erreur de chargement des données.
        </div>
    `;
});

</script>

</body>
</html>
